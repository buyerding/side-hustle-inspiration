<html lang="zh-CN">

  <title>副业灵感库 · 135 个数字产品方向</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%2310283f%22%2F%3E%3Cpath%20d%3D%22M18%2017h28v8H18zm0%2014h18v8H18zm0%2014h24v8H18z%22%20fill%3D%22%2355d6be%22%2F%3E%3Ccircle%20cx%3D%2247%22%20cy%3D%2235%22%20r%3D%226%22%20fill%3D%22%23ffcc66%22%2F%3E%3C%2Fsvg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #10283f;
      --ink-soft: #486276;
      --paper: #f3f7fa;
      --card: #ffffff;
      --line: #d9e4eb;
      --mint: #55d6be;
      --mint-dark: #087f72;
      --sun: #ffcc66;

    * { box-sizing: border-box; }

    }

    button { color: inherit; }
    .shell { width: min(1180px, 100%); margin: 0 auto; padding: 0 20px 56px; }
    .masthead {
      position: relative;
      overflow: hidden;
      margin: 18px 0 16px;
      padding: clamp(24px, 5vw, 52px);
      border-radius: 28px;
      background: var(--ink);
      color: #fff;
      box-shadow: 0 18px 50px rgba(16,40,63,.2);
    }
    .masthead::after {
      content: "135";

      right: -12px;
      bottom: -58px;
      color: rgba(255,255,255,.055);

    }
    .eyebrow { margin: 0 0 8px; color: var(--mint); font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { position: relative; z-index: 1; margin: 0; max-width: 760px; font-size: clamp(2rem, 7vw, 4.8rem); line-height: 1.05; letter-spacing: -.045em; }
    .intro { position: relative; z-index: 1; max-width: 680px; margin: 18px 0 0; color: #d7e8f1; font-size: clamp(1rem, 2.2vw, 1.18rem); }
    .stats { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .stat { min-width: 120px; padding: 10px 14px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: rgba(255,255,255,.07); backdrop-filter: blur(10px); }
    .stat b { display: block; font-size: 1.35rem; line-height: 1.1; }
    .stat span { color: #bcd0dc; font-size: .78rem; }
    .notice { display: flex; align-items: flex-start; gap: 12px; margin: 16px 0; padding: 14px 16px; border: 1px solid #f1d69b; border-radius: 16px; background: #fff8e7; color: #6d4c12; font-size: .9rem; }
    .notice-icon { flex: 0 0 auto; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--sun); color: var(--ink); font-weight: 900; }
    .workspace { position: sticky; top: 0; z-index: 20; margin: 16px 0 22px; padding: 14px; border: 1px solid rgba(217,228,235,.9); border-radius: 20px; background: rgba(255,255,255,.9); box-shadow: var(--shadow); backdrop-filter: blur(18px); }
    .search-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }

    .search {

    }
    .search:focus { border-color: var(--mint-dark); box-shadow: 0 0 0 3px rgba(85,214,190,.18); }

    .clear-search:hover { background: #e9f1f5; }
    .mode-buttons { display: flex; gap: 6px; }

    .theme-scroll { display: flex; gap: 8px; margin-top: 12px; padding-bottom: 2px; overflow-x: auto; scrollbar-width: thin; }
    .theme-chip { flex: 0 0 auto; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink-soft); cursor: pointer; font-size: .86rem; font-weight: 700; }
    .theme-chip[aria-pressed="true"] { border-color: var(--mint-dark); background: #dff7f2; color: #075f57; }
    .result-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 18px; }
    .result-line p { margin: 0; color: var(--ink-soft); }
    .result-line strong { color: var(--ink); }
    .reset { border: 0; background: transparent; color: var(--mint-dark); cursor: pointer; font-weight: 750; }
    .theme-section { margin: 0 0 32px; scroll-margin-top: 180px; }
    .section-heading { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; margin-bottom: 13px; }
    .section-index { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; background: var(--ink); color: var(--mint); font: 900 1rem/1 Georgia, serif; }
    .section-heading h2 { margin: 0; font-size: clamp(1.2rem, 3vw, 1.55rem); line-height: 1.25; }
    .section-heading p { margin: 2px 0 0; color: var(--ink-soft); font-size: .86rem; }
    .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .idea-card { display: flex; flex-direction: column; min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: 0 3px 14px rgba(16,40,63,.045); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .idea-card:hover { transform: translateY(-2px); border-color: #b6cbd8; box-shadow: var(--shadow); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-number { color: #7890a0; font: 700 .8rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .favorite { display: grid; place-items: center; flex: 0 0 auto; width: 38px; height: 38px; margin: -7px -7px 0 0; border: 0; border-radius: 50%; background: transparent; color: #8ca0ad; cursor: pointer; font-size: 1.4rem; }
    .favorite:hover { background: #edf4f7; color: var(--ink); }

    .idea-card h3 { margin: 3px 0 12px; padding: 8px 10px; border-left: 4px solid var(--mint-dark); border-radius: 0 9px 9px 0; background: #edf8f6; font-size: 1.18rem; line-height: 1.35; letter-spacing: -.015em; }
    .risk { display: inline-flex; align-items: center; align-self: flex-start; gap: 7px; margin-bottom: 14px; padding: 5px 9px; border-radius: 9px; font-size: .76rem; font-weight: 780; line-height: 1.35; }
    .risk::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .risk-low { background: #e3f8f3; color: var(--safe); }
    .risk-caution { background: #fff3d8; color: var(--warning); }
    .risk-high { background: #ffe7ea; color: var(--danger); }
    .examples { display: flex; flex-wrap: wrap; gap: 7px; margin-top: auto; }
    .example { max-width: 100%; padding: 5px 8px; overflow: hidden; border: 1px solid #d8e7ed; border-radius: 8px; background: #f7fafc; color: #3e596c; font-size: .78rem; line-height: 1.35; text-overflow: ellipsis; }
    a.example { text-decoration: none; transition: .18s ease; }
    a.example:hover, a.example:focus-visible { border-color: var(--mint-dark); background: #e5f8f4; color: #075f57; transform: translateY(-1px); outline: none; }
    .examples::before { content: "可点击子词条"; width: 100%; margin-bottom: 1px; color: #7890a0; font-size: .7rem; font-weight: 800; letter-spacing: .04em; }
    .detail-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 15px; padding-top: 13px; border-top: 1px solid #e8eff3; color: var(--mint-dark); font-size: .86rem; font-weight: 800; text-decoration: none; }
    .detail-link span { transition: transform .18s ease; }
    .detail-link:hover span { transform: translateX(3px); }
    .empty { display: none; padding: 52px 20px; border: 1px dashed #b9cbd7; border-radius: 20px; background: rgba(255,255,255,.55); text-align: center; }
    .empty.show { display: block; }
    .empty strong { display: block; margin-bottom: 4px; font-size: 1.12rem; }
    [hidden] { display: none !important; }
    .detail-shell { width: min(980px, 100%); margin: 0 auto; padding: 18px 20px 64px; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink); font-weight: 800; text-decoration: none; }
    .back-link:hover { color: var(--mint-dark); }
    .detail-hero { position: relative; overflow: hidden; margin: 10px 0 16px; padding: clamp(26px, 6vw, 56px); border-radius: 28px; background: var(--ink); color: #fff; box-shadow: 0 18px 50px rgba(16,40,63,.18); }
    .detail-hero::after { content: attr(data-number); position: absolute; right: -10px; bottom: -46px; color: rgba(255,255,255,.055); font: 900 clamp(8rem, 25vw, 15rem)/1 Georgia, serif; pointer-events: none; }
    .detail-kicker { position: relative; z-index: 1; margin: 0 0 10px; color: var(--mint); font-size: .8rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .detail-hero h1 { max-width: 720px; font-size: clamp(2rem, 7vw, 4.2rem); }
    .detail-lead { position: relative; z-index: 1; max-width: 760px; margin: 18px 0 0; color: #d8e7ef; font-size: clamp(1rem, 2.2vw, 1.12rem); }
    .detail-hero .risk { position: relative; z-index: 1; margin: 20px 0 0; }
    .detail-hero-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .category-path { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
    .category-badge { padding: 6px 10px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: rgba(255,255,255,.09); color: #e5f1f6; font-size: .78rem; font-weight: 750; }
    .category-badge strong { color: var(--mint); }
    .detail-save { min-height: 42px; padding: 0 14px; border: 1px solid rgba(255,255,255,.22); border-radius: 12px; background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font-weight: 800; }
    .detail-save[aria-pressed="true"] { border-color: var(--sun); color: var(--sun); }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .detail-panel { min-width: 0; padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: #fff; box-shadow: 0 4px 18px rgba(16,40,63,.05); }
    .detail-panel.full { grid-column: 1 / -1; }
    .detail-panel h2 { margin: 0 0 12px; font-size: 1.08rem; line-height: 1.35; }
    .detail-panel p { margin: 0; color: #3f5b6f; }
    .detail-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .detail-list li { position: relative; padding-left: 18px; color: #3f5b6f; }
    .detail-list li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--mint-dark); }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .detail-tag { padding: 7px 10px; border: 1px solid #dce8ee; border-radius: 10px; background: #f5f9fb; color: #365468; font-size: .86rem; }
    .child-term-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .child-term { position: relative; min-width: 0; padding: 13px 38px 13px 13px; border: 1px solid #cfe2e6; border-radius: 14px; background: linear-gradient(145deg, #f4fbfa, #fff); color: inherit; text-decoration: none; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .child-term::after { content: "→"; position: absolute; top: 50%; right: 14px; transform: translateY(-50%); color: var(--mint-dark); font-weight: 900; }
    .child-term:hover { transform: translateY(-2px); border-color: var(--mint-dark); box-shadow: 0 8px 20px rgba(8,127,114,.1); }
    .child-term strong { display: block; color: var(--ink); font-size: .96rem; line-height: 1.35; }
    .child-term span { display: inline-block; margin-top: 8px; padding: 3px 7px; border-radius: 999px; background: #dff7f2; color: #075f57; font-size: .72rem; font-weight: 800; }
    .child-term em { display: block; margin-top: 8px; color: var(--mint-dark); font-size: .72rem; font-style: normal; font-weight: 850; }
    .term-context { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .term-context a { color: var(--mint-dark); font-weight: 800; text-decoration: none; }
    .market-note { margin-bottom: 14px !important; font-size: .86rem; line-height: 1.6; }
    .market-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .market-card { display: flex; flex-direction: column; min-height: 150px; padding: 16px; border: 1px solid #cfe0e7; border-radius: 15px; background: #f9fcfd; }
    .market-card small { color: #71899a; }
    .market-card h3 { margin: 7px 0 8px; font-size: 1.02rem; }
    .market-card p { display: -webkit-box; margin: 0 0 14px; overflow: hidden; color: #536d7d; font-size: .82rem; line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .market-card a { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; margin-top: auto; border-radius: 10px; background: var(--ink); color: #fff; font-size: .84rem; font-weight: 850; text-decoration: none; }
    .market-card a:hover { background: var(--mint-dark); }
    .market-empty { padding: 18px; border: 1px dashed #d9b7bd; border-radius: 14px; background: #fff4f5; color: #80424b; }
    .expansion-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .expansion { padding: 13px; border-radius: 13px; background: #eef8f6; color: #155f59; font-weight: 750; }
    .plans { display: grid; gap: 14px; }
    .plan { position: relative; overflow: hidden; padding: 20px; border: 1px solid #cfdfe7; border-radius: 17px; background: #fbfdfe; }
    .plan::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--mint-dark); }
    .plan-label { display: inline-block; margin-bottom: 8px; padding: 4px 8px; border-radius: 7px; background: var(--ink); color: var(--mint); font-size: .72rem; font-weight: 850; letter-spacing: .04em; }
    .plan h3 { margin: 0 0 13px; font-size: 1.15rem; }
    .plan-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .plan-fact { padding: 11px; border-radius: 11px; background: #eef4f7; }

    .plan-fact span { color: #29475b; font-size: .85rem; line-height: 1.45; }
    .case-box { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: #fff4d9; color: #684a12; font-size: .86rem; }
    .steps { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: steps; }
    .steps li { counter-increment: steps; display: grid; grid-template-columns: 34px 1fr; gap: 11px; align-items: start; color: #365468; }
    .steps li::before { content: counter(steps); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--ink); color: var(--mint); font: 800 .9rem/1 ui-monospace, monospace; }
    .risk-panel { border-color: #efd297; background: #fff8e7; }
    .risk-panel.high { border-color: #f1bfc5; background: #fff0f2; }
    .related-links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .related-link { display: flex; flex-direction: column; min-height: 90px; padding: 13px; border: 1px solid var(--line); border-radius: 13px; background: #f8fbfc; color: var(--ink); text-decoration: none; }
    .related-link small { color: #7890a0; }
    .related-link strong { margin-top: auto; line-height: 1.35; }
    .detail-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .nav-link { min-width: 0; padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); text-decoration: none; }
    .nav-link.next { text-align: right; }
    .nav-link small { display: block; color: #7890a0; }
    .nav-link strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .footer { padding: 16px 0 calc(22px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); color: var(--ink-soft); font-size: .82rem; text-align: center; }
    .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 50; transform: translate(-50%, 16px); padding: 10px 14px; border-radius: 12px; background: var(--ink); color: #fff; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .2s ease; font-size: .88rem; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    mark { border-radius: 3px; background: #ffe49a; color: inherit; }
    @media (max-width: 900px) { .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) {
      .shell { padding: 0 12px 40px; }
      .masthead { margin-top: 10px; border-radius: 22px; padding: 24px 20px 26px; }
      .masthead::after { right: -4px; bottom: -28px; font-size: 9rem; }
      .intro { margin-top: 12px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 20px; }

      .stat span { font-size: .7rem; }

      .search-row { grid-template-columns: 1fr; }
      .mode-buttons { display: grid; grid-template-columns: repeat(3, 1fr); }
      .mode-button { height: 40px; padding: 0 7px; font-size: .8rem; }
      .theme-scroll { margin-top: 10px; }
      .card-grid { grid-template-columns: 1fr; }
      .idea-card { padding: 17px; }

      body { background: #fff; }
      .shell { width: 100%; padding: 0; }
      .masthead { box-shadow: none; }

    }

<body>
  <main id="library-view" class="shell">
    <header class="masthead">
      <p class="eyebrow">Side Project Field Guide</p>
      <h1>副业灵感库</h1>
      <p class="intro">135 个数字产品与虚拟服务方向。先找需求，再做小样验证；优先选择能原创、可授权、风险清晰的方向。</p>
      <div class="stats" aria-label="灵感库概览">
        <div class="stat"><b>135</b><span>灵感方向</span></div>
        <div class="stat"><b>33</b><span>低风险优先</span></div>
        <div class="stat"><b>10</b><span>主题板块</span></div>
      </div>
    </header>

    <aside class="notice" aria-label="风险提示">
      <span class="notice-icon">!</span>
      <span>风险标签仅用于初步筛选，不构成法律或经营建议。实际开展前，请核验版权、授权、隐私、平台规则及当地法律；标记为高风险的方向不建议尝试。</span>
    </aside>

    <section class="workspace" aria-label="筛选工具">
      <div class="search-row">
        <label class="search-wrap">

          '<div class="term-context"><a href="' + ideaHash(item) + '">← 返回“' + escapeHtml(item.title) + '”详情</a></div>' +
          '<div class="detail-grid">' +
            '<section class="detail-panel"><h2>词条解释</h2><p>“' + escapeHtml(term.name) + '”可以理解为：围绕这一明确主题，将信息、素材、模板、工具或服务整理成用户更容易检索、理解和使用的交付物。实际价值取决于内容来源、适用场景、更新频率和交付质量。</p></section>' +
            '<section class="detail-panel"><h2>适合的验证方式</h2><p>先观察目标用户正在解决的具体问题，再制作一个最小样品。不要先追求大而全；优先验证用户是否愿意为节省时间、降低难度或获得更清晰结果付费。</p></section>' +
            '<section class="detail-panel full"><h2>词条拓展</h2><div class="expansion-grid">' + extensions.map((value) => '<div class="expansion">' + escapeHtml(value) + '</div>').join('') + '</div></section>' +
            '<section class="detail-panel full"><h2>相关闲鱼卖家店铺</h2><p class="market-note">从闲鱼公开搜索结果关联商品中提取卖家主页；优先使用本主词条的直接匹配，不足时由同主题已验证店铺补充。采集日期：' + escapeHtml(collectedDate) + '。店铺与商品状态可能变化，请自行核验信用、版权、授权、退款规则与平台条款。</p>' + marketMarkup + '</section>' +
            '<section class="detail-panel full risk-panel ' + (item.market.blocked ? 'high' : '') + '"><h2>使用提醒</h2><p>' + escapeHtml(item.detail.riskAdvice) + '</p></section>' +
          '</div>' +
        '</article>';
      savedCount.textContent = saved.size;
    }

    function route() {
      const termMatch = location.hash.match(/^#term-(\d{1,3})-(\d{1,2})$/);
      if (termMatch) {
        const item = DATA.find((candidate) => candidate.number === Number(termMatch[1]));
        const termIndex = Number(termMatch[2]);
        const term = item?.detail.childTerms[termIndex];
        if (item && term) {
          libraryView.hidden = true;
          detailView.hidden = false;
          renderTermDetail(item, term, termIndex);
          document.title = term.name + ' · ' + item.title + ' · 副业灵感库';
          window.scrollTo(0, 0);
          return;
        }
      }
      const match = location.hash.match(/^#idea-(\d{1,3})$/);
      const item = match ? DATA.find((candidate) => candidate.number === Number(match[1])) : null;
      if (item) {
        libraryView.hidden = true;
        detailView.hidden = false;
        renderDetail(item);
        document.title = item.title + ' · 副业灵感库';
        window.scrollTo(0, 0);
        return;
      }
      detailView.hidden = true;
      libraryView.hidden = false;
      document.title = '副业灵感库 · 135 个数字产品方向';
      requestAnimationFrame(() => window.scrollTo(0, state.scrollY));
    }

    function renderThemeFilters() {
      const container = document.querySelector('#theme-filter');
      const chips = [{ id: 'all', name: '全部主题' }, ...THEMES];
      container.innerHTML = chips.map((theme) => '<button class="theme-chip" type="button" data-theme="' + theme.id + '" aria-pressed="' + (state.theme === theme.id) + '">' + escapeHtml(theme.name) + '</button>').join('');
    }

    function setMode(mode) {
      state.mode = mode;
      document.querySelectorAll('[data-mode]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      render();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    function toggleSaved(number) {
      const willSave = !saved.has(number);
      willSave ? saved.add(number) : saved.delete(number);
      localStorage.setItem('side-idea-saved', JSON.stringify([...saved]));
      showToast(willSave ? '已加入收藏' : '已取消收藏');
      return willSave;
    }

    search.addEventListener('input', () => { state.query = search.value.trim(); render(); });
    document.querySelector('#clear-search').addEventListener('click', () => { search.value = ''; state.query = ''; search.focus(); render(); });
    document.querySelector('.mode-buttons').addEventListener('click', (event) => { const button = event.target.closest('[data-mode]'); if (button) setMode(button.dataset.mode); });
    document.querySelector('#theme-filter').addEventListener('click', (event) => { const button = event.target.closest('[data-theme]'); if (!button) return; state.theme = button.dataset.theme; renderThemeFilters(); render(); });
    document.querySelector('#reset').addEventListener('click', () => { search.value = ''; state.query = ''; state.theme = 'all'; renderThemeFilters(); setMode('all'); });
    results.addEventListener('click', (event) => {
      if (event.target.closest('.detail-link')) state.scrollY = window.scrollY;
      const button = event.target.closest('[data-save]');
      if (!button) return;
      const number = Number(button.dataset.save);
      toggleSaved(number);
      render();
    });
    detailContent.addEventListener('click', (event) => {
      const button = event.target.closest('[data-detail-save]');
      if (!button) return;
      const number = Number(button.dataset.detailSave);
      toggleSaved(number);
      const item = DATA.find((candidate) => candidate.number === number);
      if (item) renderDetail(item);
    });
    window.addEventListener('hashchange', route);
    document.addEventListener('keydown', (event) => {
      if (event.key === '/' && document.activeElement !== search) { event.preventDefault(); search.focus(); }
      if (event.key === 'Escape' && document.activeElement === search) { search.value = ''; state.query = ''; render(); search.blur(); }
    });

    renderThemeFilters();
    render();
    route();
  </script>
</body>
</html>
